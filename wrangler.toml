name = "track-manager-backend"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ── Durable Object for realtime (replaces socket.io) ────────────
[[durable_objects.bindings]]
name = "REALTIME_ROOM"
class_name = "RealtimeRoom"

[[migrations]]
tag = "v1"
new_classes = ["RealtimeRoom"]

# ── Cloudflare native rate limiting (replaces express-rate-limit) ─
# One binding per limiter you need distinct limits for.
[[unsafe.bindings]]
name = "API_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[[unsafe.bindings]]
name = "AUTH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "TEMP_LINK_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 4, period = 60 }

# ── Secrets (set with: wrangler secret put NAME) ─────────────────
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# SUPABASE_ANON_KEY
# SESSION_SECRET
# FRONTEND_URL
# BACKEND_URL
# ADMIN_EMAIL

[observability]
enabled = true

[dev]
port = 3001

